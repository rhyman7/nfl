name: Build matchup PDFs

# Rebuilds pdf/ (the Download PDF files, matchups and EPA, and the game packets: Weekly Matchup
# Report, printed matchups, EPA and value board pages, plus packets.json) whenever the data or a
# layout changes, and daily after the value board's own update.
on:
  push:
    branches: [main]
    paths:
      - "data/data.json"
      - "data/epa.json"
      - "epa.html"
      - "epa.js"
      - "print.html"
      - "print.js"
      - "common.js"
      - "teamcolors.js"
      - "style.css"
      - "scripts/build_pdfs.py"
      - "scripts/build_report.py"
      - "scripts/build_packets.py"
      - "scripts/report.css"
  # data.json commits made by the Rebuild workflow don't trigger push events
  workflow_run:
    workflows: ["Rebuild NFL data"]
    types: [completed]
  schedule:
    - cron: "47 12 * 9-12,1-2 *"   # daily 12:47 UTC, after the NFL value board updates (11:17)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-pdfs
  cancel-in-progress: true

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # the value board (public repo) supplies part 4 of each packet
      - uses: actions/checkout@v4
        with:
          repository: rhyman7/fb-value-board
          path: _value-board

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Build PDFs
        run: python scripts/build_pdfs.py

      - name: Build game packets
        run: python scripts/build_packets.py --value-board _value-board

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A pdf
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Rebuild matchup PDFs and game packets"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
