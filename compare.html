<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team vs Team · NFL Matchup Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1><a href="index.html">NFL Matchup Dashboard</a></h1>
    <nav class="site-nav no-print">
      <a href="index.html">This Week's Matchups</a>
      <a href="compare.html" class="active">Team vs Team</a>
    </nav>
  </div>
  <div class="topbar-meta">
    <span id="lastUpdated">Loading...</span>
  </div>
</header>

<main id="app">
  <section class="matchup-picker">
    <div class="picker">
      <label for="team1Select">Team 1</label>
      <select id="team1Select"></select>
    </div>
    <div class="vs">VS</div>
    <div class="picker">
      <label for="team2Select">Team 2</label>
      <select id="team2Select"></select>
    </div>
    <button id="printBothBtn" class="print-btn" type="button">🖨 Print Matchup</button>
  </section>

  <section id="teamCards"></section>
</main>

<footer class="no-print">
  <p>Data updates weekly. Team stats reflect the most recently loaded weekly export.</p>
</footer>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
